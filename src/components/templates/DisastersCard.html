<div class="dg-card dg-disasters-card">
    <div class="dg-card-header">
        <span class="dg-card-icon danger">📜</span>
        <h3 class="dg-card-title">{{app.disasters.title}}</h3>
    </div>

    <div class="dg-disaster-list">
        <div class="dg-disaster-item">
            <span class="dg-disaster-icon">🌀</span>
            <div class="dg-disaster-info">
                <p class="dg-disaster-name">Hurricane Katrina</p>
                <p class="dg-disaster-year">2005</p>
            </div>
            <span class="dg-disaster-loss" style="background-color: #3B82F614; color: #3B82F6;">$186B</span>
        </div>

        <div class="dg-disaster-item">
            <span class="dg-disaster-icon">🌀</span>
            <div class="dg-disaster-info">
                <p class="dg-disaster-name">Hurricane Harvey</p>
                <p class="dg-disaster-year">2017</p>
            </div>
            <span class="dg-disaster-loss" style="background-color: #3B82F614; color: #3B82F6;">$125B</span>
        </div>

        <div class="dg-disaster-item">
            <span class="dg-disaster-icon">🌊</span>
            <div class="dg-disaster-info">
                <p class="dg-disaster-name">Hurricane Sandy</p>
                <p class="dg-disaster-year">2012</p>
            </div>
            <span class="dg-disaster-loss" style="background-color: #06B6D414; color: #06B6D4;">$65B</span>
        </div>

        <div class="dg-disaster-item">
            <span class="dg-disaster-icon">🏔️</span>
            <div class="dg-disaster-info">
                <p class="dg-disaster-name">Northridge Earthquake</p>
                <p class="dg-disaster-year">1994</p>
            </div>
            <span class="dg-disaster-loss" style="background-color: #F59E0B14; color: #F59E0B;">$44B</span>
        </div>

        <div class="dg-disaster-item">
            <span class="dg-disaster-icon">🔥</span>
            <div class="dg-disaster-info">
                <p class="dg-disaster-name">Camp Fire (CA)</p>
                <p class="dg-disaster-year">2018</p>
            </div>
            <span class="dg-disaster-loss" style="background-color: #EF444414; color: #EF4444;">$16.5B</span>
        </div>

        <div class="dg-disaster-item">
            <span class="dg-disaster-icon">🌪️</span>
            <div class="dg-disaster-info">
                <p class="dg-disaster-name">Joplin Tornado (MO)</p>
                <p class="dg-disaster-year">2011</p>
            </div>
            <span class="dg-disaster-loss" style="background-color: #8B5CF614; color: #8B5CF6;">$3.2B</span>
        </div>
    </div>

    <p class="dg-disasters-note">{{app.disasters.lossLabel}} · NOAA / FEMA data</p>
</div>
