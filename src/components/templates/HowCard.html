<div class="dg-card dg-how-card">
    <div class="dg-card-header">
        <span class="dg-card-icon">🗺️</span>
        <h3 class="dg-card-title">{{app.howCard.title}}</h3>
    </div>

    <div class="dg-timeline">
        <div class="dg-timeline-item">
            <div class="dg-timeline-marker">
                <div class="dg-timeline-badge" style="background-color: #10B981;">1</div>
                <div class="dg-timeline-connector"></div>
            </div>
            <div class="dg-timeline-content">
                <div class="dg-timeline-title">
                    <span>📍</span>
                    {{app.howCard.s1t}}
                </div>
                <p class="dg-timeline-desc">{{app.howCard.s1d}}</p>
            </div>
        </div>

        <div class="dg-timeline-item">
            <div class="dg-timeline-marker">
                <div class="dg-timeline-badge" style="background-color: #3B82F6;">2</div>
                <div class="dg-timeline-connector"></div>
            </div>
            <div class="dg-timeline-content">
                <div class="dg-timeline-title">
                    <span>💰</span>
                    {{app.howCard.s2t}}
                </div>
                <p class="dg-timeline-desc">{{app.howCard.s2d}}</p>
            </div>
        </div>

        <div class="dg-timeline-item">
            <div class="dg-timeline-marker">
                <div class="dg-timeline-badge" style="background-color: #8B5CF6;">3</div>
            </div>
            <div class="dg-timeline-content">
                <div class="dg-timeline-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2c6.627 0 12 5.373 12 12s-5.373 12-12 12S0 20.627 0 14 5.373 2 12 2z"></path>
                        <circle cx="12" cy="17" r="1"></circle>
                        <path d="M12 5v7"></path>
                    </svg>
                    {{app.howCard.s3t}}
                </div>
                <p class="dg-timeline-desc">{{app.howCard.s3d}}</p>
            </div>
        </div>
    </div>
</div>
